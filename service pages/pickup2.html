<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send Your Cloth - Service 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/main-style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{ --chocolate:#3b1f0f; --dark-brown:#2a140a; --gold:#d4af37; --light-gold:#f6e7b2; }
*{ margin:0; padding:0; box-sizing:border-box; font-family:Poppins, Arial, sans-serif; }

.page-bg{ min-height:100vh; background:linear-gradient(to bottom,var(--dark-brown),var(--chocolate)); padding:60px 15px; }
.form-card{ max-width:800px; margin:auto; background:var(--light-gold); padding:40px; border-radius:20px; }
.form-card h2{ color:var(--gold); margin-bottom:8px; }
.form-card h3{ color:#5a4a2f; margin-bottom:25px; font-size: 1.1rem;}
.form-group{ margin-bottom:16px; }
input, textarea, select{ width:100%; padding:14px 16px; border-radius:8px; border:1px solid #ccc; font-size:15px; background: #fff; }
textarea{ resize:none; height:120px; }
.mobile-wrap{ display:flex; border:1px solid #ccc; border-radius:8px; overflow:hidden; background:#fff; }
.country-code{ padding:14px 16px; background:#eee; font-weight:600; border-right: 1px solid #ccc;}
.mobile-wrap input{ border:none; outline:none; flex:1; }
button{ background:#331300; color:#fff; border:none; padding:14px 60px; border-radius:8px; font-size: 20px; cursor:pointer; width: 100%;}
button:hover{ background:#b8962e; }
button:disabled{ background: #999; cursor: not-allowed; }
label{ display:block; margin-bottom:6px; font-weight:500; color: #3b1f0f; }

</style>
</head>
<body>
  
<header class="navbar">
  <div class="logo-container">
    <img src="/ModasouLogo.png" class="logo-img" alt="Logo">
    <h1 class="logo-text">MODASOU</h1>
  </div>
  <nav class="menu-item"><a href="/index.html">Home</a></nav>
</header>

<section class="page-bg">
  <div class="form-card">
    <h2>Schedule Cloth Pickup</h2>
    <h3>Service 2: Material Ready, Design Needed</h3>

    <form id="pickupForm">
      <div class="form-group">
        <label>Enter your full name</label>
        <input type="text" id="fullname" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label>Enter your WhatsApp number</label>
        <div class="mobile-wrap">
          <span class="country-code">+91</span>
          <input type="tel" id="watsapp_number" placeholder="10 digit number" maxlength="10" required>
        </div>
      </div>

      <div class="form-group">
        <label>Pickup Date</label>
        <input type="date" id="pickup_date" required min="2026-01-01">
      </div>

      <div class="form-group">
        <label>Pickup Time Slot</label>
        <select id="pickup_time" required>
          <option value="">Select Time Slot</option>
          <option value="9:00 AM - 1:00 PM">9:00 AM – 1:00 PM</option>
          <option value="1:00 PM - 6:00 PM">1:00 PM – 6:00 PM</option>
          <option value="6:00 PM - 10:00 PM">6:00 PM – 10:00 PM</option>
        </select>
      </div>

      <div class="form-group">
        <label>Enter your full address</label>
        <textarea id="address" placeholder="House no, Area, City" required></textarea>
      </div>

      <div class="form-group">
        <label>City pincode</label>
        <input type="text" id="pincode" placeholder="6-digit Pincode" maxlength="6" required>
      </div>

      <button type="submit" id="submitBtn">Schedule Cloth Pickup</button>
    </form>
  </div>
</section>





<script>
  // Initialize EmailJS and Supabase
  emailjs.init("V5fGF5JF2JAOD_AcW"); 
  const m_db = window.supabase.createClient(
    'https://gztneesmxwfhdmhqikel.supabase.co', 
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dG5lZXNteHdmaGRtaHFpa2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNjAzNDAsImV4cCI6MjA4MjczNjM0MH0.iWDtkljuQLZFQeLvBrJHVyXNfpu4bJOvvVab3G0eOsA'
  );
  let isSubmitting = false;

  async function handleFinalOrder(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    if (isSubmitting) return false;
isSubmitting = true;
    
    const btn = document.getElementById('submitBtn');
    const sessionId = localStorage.getItem('modasou_session_id');

    if (!sessionId) {
      alert("Error: No session found. Please go back to Service 2 and submit your fabric first.");
      return false;
    }

    btn.innerText = "Processing Order...";
    btn.disabled = true;

    try {
      // Check if order already exists (prevents duplicate error)
      console.log("Checking for existing order with session:", sessionId);
      const { data: existingOrder } = await m_db
        .from('orders')
        .select('order_id, customer_name, full_name, name')
        .eq('session_id', sessionId)
        .maybeSingle();
      
      if (existingOrder) {
        const customerName = existingOrder.customer_name || existingOrder.full_name || existingOrder.name || 'Customer';
        console.log("⚠️ Order already exists:", existingOrder.order_id);
        alert(`✅ Order already submitted!\n\nOrder ID: ${existingOrder.order_id}\nCustomer: ${customerName}\n\nWe will contact you soon!`);
        localStorage.removeItem('modasou_session_id');
        setTimeout(() => {
          window.location.href = "/thank-you.html";
        }, 500);
        return false;
      }

      // Fetch Fabric Data from service_2
      console.log("Fetching fabric data for session:", sessionId);
      const { data: fabricRow, error: fetchError } = await m_db
        .from('service_2')
        .select('*')
        .eq('session_id', sessionId)
        .maybeSingle(); 

      if (fetchError) throw new Error("Fetch Error: " + fetchError.message);
      if (!fabricRow) throw new Error("Fabric not found. Please go back and submit your fabric first.");

      // Get form values
      const fullName = document.getElementById('fullname').value.trim();
      const whatsappNumber = document.getElementById('watsapp_number').value.trim();
      const pickupDate = document.getElementById('pickup_date').value;
      const pickupTime = document.getElementById('pickup_time').value;
      const fullAddress = document.getElementById('address').value.trim();
      const pincode = document.getElementById('pincode').value.trim();

      // Save to service_2_pickups
      console.log("Saving pickup details...");
      await m_db.from('service_2_pickups').upsert([{
        session_id: sessionId,
        full_name: fullName,
        whatsapp_number: whatsappNumber,
        pickup_date: pickupDate,
        pickup_time: pickupTime,
        full_address: fullAddress,
        pincode: pincode
      }]);

      // Generate Order ID ONCE
      const uniqueOrderId = "MODASOU_" + Math.floor(1000 + Math.random() * 9000);
      console.log("🆔 Generated Order ID:", uniqueOrderId);

      // Clean Google Image URL properly
      const cleanGoogleUrl = (url) => {
        if (!url || url.trim() === '') return null;
        
        let cleaned = String(url).trim();
        
        // Remove quotes and extra spaces
        cleaned = cleaned.replace(/^["']|["']$/g, '');
        cleaned = cleaned.replace(/\s+/g, '');
        
        // Handle Google Images search URLs (extract actual image URL)
        if (cleaned.includes('google.com/imgres') || cleaned.includes('google.com/search')) {
          try {
            const urlParams = new URLSearchParams(cleaned.split('?')[1]);
            const imgUrl = urlParams.get('imgurl');
            if (imgUrl) {
              cleaned = decodeURIComponent(imgUrl);
              console.log("✅ Extracted image URL from Google search:", cleaned);
            }
          } catch (e) {
            console.warn("Could not extract from Google search URL");
          }
        }
        
        // If it already has http:// or https://, use it
        if (cleaned.startsWith('http://') || cleaned.startsWith('https://')) {
          console.log("✅ Valid Google URL:", cleaned);
          return cleaned;
        }
        
        // Add https:// if missing
        cleaned = `https://${cleaned}`;
        console.log("✅ Added https:// to URL:", cleaned);
        return cleaned;
      };
      
      const googleImageUrl = cleanGoogleUrl(fabricRow.google_image_url);
      
      // FIXED: Create proper email links
      const googleImageHtml = googleImageUrl 
        ? `<a href="${googleImageUrl}" target="_blank" rel="noopener noreferrer" style="color:#1a73e8;text-decoration:none;font-weight:bold;">View Google Image</a>`
        : 'Not Provided';
      
      const googleImageText = googleImageUrl || "Not Provided";
      
      // FIXED: Design image link
      const designImageHtml = fabricRow.design_image_url
        ? `<a href="${fabricRow.design_image_url}" target="_blank" rel="noopener noreferrer" style="color:#1a73e8;text-decoration:none;font-weight:bold;">View Design Image</a>`
        : 'Not Provided';

      console.log("📸 Google Image URL:", googleImageUrl);
      console.log("🎨 Design Image URL:", fabricRow.design_image_url);

      // Build order data object
      console.log("💾 Saving to orders table with Order ID:", uniqueOrderId);
      
      const orderData = {
        order_id: uniqueOrderId,
        session_id: sessionId,
        service: 'Fabric Pickup Service',
        status: 'pending',
        order_date: new Date().toISOString(),
        created_at: new Date().toISOString()
      };

      // Customer info
      if (fullName) {
        orderData.customer_name = fullName;
        orderData.full_name = fullName;
        orderData.name = fullName;
      }

      // Contact info
      if (whatsappNumber) {
        orderData.whatsapp = whatsappNumber;
        orderData.whatsapp_number = whatsappNumber;
        orderData.phone = whatsappNumber;
      }

      // Pickup details
      if (pickupDate) orderData.pickup_date = pickupDate;
      if (pickupTime) orderData.pickup_time = pickupTime;
      if (fullAddress) {
        orderData.address = fullAddress;
        orderData.full_address = fullAddress;
      }
      if (pincode) orderData.pincode = pincode;

      // Media URLs
      if (fabricRow.fabric_video_url) {
        orderData.fabric_video_url = fabricRow.fabric_video_url;
        orderData.video_url = fabricRow.fabric_video_url;
      }
      if (fabricRow.design_image_url) {
        orderData.fabric_image_url = fabricRow.design_image_url;
        orderData.design_image_url = fabricRow.design_image_url;
        orderData.image_url = fabricRow.design_image_url;
      }
      
      // Save CLEANED Google URL
      if (googleImageUrl) {
        orderData.google_image_url = googleImageUrl;
        orderData.google_reference = googleImageUrl;
      }

      // Measurements
      if (fabricRow.top_mtr !== undefined) {
        orderData.top_meter = fabricRow.top_mtr || 0;
        orderData.top_mtr = fabricRow.top_mtr || 0;
      }
      if (fabricRow.bottom_mtr !== undefined) {
        orderData.bottom_meter = fabricRow.bottom_mtr || 0;
        orderData.bottom_mtr = fabricRow.bottom_mtr || 0;
      }

      // Preferences
      if (fabricRow.lining_preference) {
        orderData.lining_preference = fabricRow.lining_preference;
        orderData.lining = fabricRow.lining_preference;
      }
      if (fabricRow.designer_name) {
        orderData.designer_name = fabricRow.designer_name;
      }
      if (fabricRow.designer_note) {
        orderData.designer_note = fabricRow.designer_note;
        orderData.note = fabricRow.designer_note;
      }

      console.log("📦 Complete order data:", orderData);

      // Save to database
      const { data: saved, error: saveError } = await m_db
        .from('orders')
        .insert([orderData])
        .select();

      if (saveError) {
        console.error("❌ SAVE FAILED:", saveError);
        throw new Error("Database save failed: " + saveError.message);
      }

      console.log("✅ ORDER SAVED TO DATABASE!", saved);

      // Send Email
      console.log("📧 Sending email with Order ID:", uniqueOrderId);
      
      try {
        const emailParams = {
          order_id: uniqueOrderId,
          user_name: fullName,
          user_phone: whatsappNumber,
          pickup_date: pickupDate,
          pickup_time: pickupTime,
          message: `${fullAddress} (${pincode})`,
          address_text: fullAddress,
          pincode_text: pincode,
          video_link: fabricRow.fabric_video_url || "No video provided",
      reference_image_link: fabricRow.design_image_url 
  ? `<a href="${fabricRow.design_image_url}" target="_blank" style="color:#1a73e8;">View Design Image</a>`
  : "Not Provided",

google_image_url: googleImageUrl 
  ? `<a href="${googleImageUrl}" target="_blank" style="color:#1a73e8;">View Google Image</a>`
  : "Not Provided",
          
          designer_name: fabricRow.designer_name || "Not Selected",
          lining_pref: fabricRow.lining_preference || "Not specified",
          designer_note: String(fabricRow.designer_note || "None").slice(0, 2000),
          fabric_measurements: `Top: ${fabricRow.top_mtr || 0}m, Bottom: ${fabricRow.bottom_mtr || 0}m`
        };
        
        console.log("📧 Email parameters:", emailParams);
        
        await emailjs.send('TailorEmailService', 'template_nz5r9d7', emailParams);
        console.log("✅ Email sent successfully!");
      } catch (emailErr) {
        console.warn("⚠️ Email failed, but order is saved:", emailErr);
      }

      // Success
      alert(`✅ Order placed successfully!\n\nOrder ID: ${uniqueOrderId}\nCustomer: ${fullName}\n\nSaved to database\n\nWe will contact you soon!`);
      
      localStorage.removeItem('modasou_session_id');
      
      setTimeout(() => {
        window.location.href = "/thank-you.html";
      }, 500);

    } catch (err) {
      console.error("❌ ERROR:", err);
      alert("Order Error: " + (err.message || err));
      btn.innerText = "Schedule Cloth Pickup";
      btn.disabled = false;
      isSubmitting = false;
    }
    
    return false;
  }

  // Attach event handlers
  const orderForm = document.getElementById('pickupForm');
if (orderForm) {
  orderForm.onsubmit = (e) => {
    e.preventDefault();
    handleFinalOrder(e);
    return false;
  };
}
  
</script></body></html>
