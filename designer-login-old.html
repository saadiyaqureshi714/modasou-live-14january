<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Designer Login – MODASOU</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 30px;
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #333;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }
    button:hover {
      background: #333;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Designer Login</h2>

  <input type="email" id="email" placeholder="Designer Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">

  <button type="button" id="loginBtn">Login</button>

  <p id="msg"></p>
</div>

<script>
  console.log('Script started');

  // Supabase configuration
  const SUPABASE_URL = "https://gztneesmxwfhdmhqikel.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dG5lZXNteHdmaGRtaHFpa2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNjAzNDAsImV4cCI6MjA4MjczNjM0MH0.iWDtkljuQLZFQeLvBrJHVyXNfpu4bJOvvVab3G0eOsA";

  console.log('Supabase library check:', typeof window.supabase);

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  console.log('Supabase client created');

  async function login() {
    console.log('Login function called!');
    
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");

    console.log('Email:', email);
    console.log('Password length:', password.length);

    if (!email || !password) {
      msg.innerText = "Please enter both email and password";
      msg.style.color = "red";
      console.log('Validation failed');
      return;
    }

    loginBtn.disabled = true;
    msg.innerText = "Logging in...";
    msg.style.color = "#666";
    console.log('Attempting login...');

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      console.log('Response received');
      console.log('Data:', data);
      console.log('Error:', error);

      if (error) {
        throw error;
      }

      msg.innerText = "Login successful ✅";
      msg.style.color = "green";
      console.log('Login successful! Redirecting...');
      
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 1000);

    } catch (error) {
      msg.innerText = "❌ " + error.message;
      msg.style.color = "red";
      console.error("Login error:", error);
      loginBtn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded');
    const loginBtn = document.getElementById('loginBtn');
    console.log('Login button found:', loginBtn);
    
    loginBtn.addEventListener('click', function() {
      console.log('Button clicked!');
      login();
    });
    
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          console.log('Enter pressed');
          login();
        }
      });
    });
  });

  console.log('Script setup complete');
</script>
</body>
</html>
