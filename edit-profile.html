<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Modasou</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #fff6d5, #f5e6b8);
            min-height: 100vh;
        }

        /* Breadcrumb */
        .breadcrumb {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #d7ccc8;
        }

        .breadcrumb a {
            color: #8b5a2b;
            text-decoration: none;
            font-size: 14px;
        }

        .breadcrumb a:hover {
            color: #d4af37;
            text-decoration: underline;
        }

        .breadcrumb span {
            color: #d4af37;
            margin: 0 8px;
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Page Title */
        .page-title {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            color: #331300;
            margin-bottom: 30px;
        }

        /* Form Card */
        .form-card {
            background: white;
            border: 1px solid #d7ccc8;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 700;
            color: #331300;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0d5c7;
        }

        .form-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-bottom: 20px;
            align-items: start;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #331300;
            padding-top: 12px;
        }

        .form-input-group {
            position: relative;
        }

        .form-input {
            width: 100%;
            max-width: 400px;
            padding: 10px 12px;
            border: 1px solid #a88734;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
            outline: none;
        }

        .input-note {
            font-size: 12px;
            color: #8b5a2b;
            margin-top: 5px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, #d4af37, #c9a227);
            border: none;
            color: #331300;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #c9a227, #b8941e);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            padding: 10px 24px;
            background: white;
            border: 1px solid #8b5a2b;
            color: #331300;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #faf8f3;
        }

        /* Success Message */
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="dashboard.html">Your Account</a>
        <span>›</span>
        <span style="color: #d4af37;">Edit Profile</span>
    </div>

    <!-- Container -->
    <div class="container">
        <h1 class="page-title">Edit Profile</h1>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            ✓ Your changes have been saved successfully!
        </div>

        <!-- Profile Form -->
        <div class="form-card">
            <h2 class="form-section-title">Personal Information</h2>
            
            <form id="profileForm">
                <div class="form-row">
                    <label class="form-label">Full Name:</label>
                    <div class="form-input-group">
                        <input type="text" id="fullName" class="form-input" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Email:</label>
                    <div class="form-input-group">
                        <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                        <div class="input-note">We'll send order confirmations to this email</div>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Phone Number:</label>
                    <div class="form-input-group">
                        <input type="tel" id="phone" class="form-input" placeholder="+91 1234567890" required>
                        <div class="input-note">For delivery updates</div>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='dashboard.html'">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Load existing data
        // Load existing data from Supabase
document.addEventListener('DOMContentLoaded', async function() {
    const userId = localStorage.getItem('userId');
    const SUPABASE_URL = 'https://gztneesmxwfhdmhqikel.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dG5lZXNteHdmaGRtaHFpa2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNjAzNDAsImV4cCI6MjA4MjczNjM0MH0.iWDtkljuQLZFQeLvBrJHVyXNfpu4bJOvvVab3G0eOsA';

    // Fetch from database
    const response = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${userId}&select=*`, {
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
        }
    });
    
    const data = await response.json();
    if (data && data[0]) {
        const customer = data[0];
        document.getElementById('fullName').value = customer.full_name || '';
        document.getElementById('email').value = customer.email || '';
        document.getElementById('phone').value = customer.phone || '';
        
        // Update localStorage too
        localStorage.setItem('userName', customer.full_name);
        localStorage.setItem('userEmail', customer.email);
        localStorage.setItem('userPhone', customer.phone || '');
    }
});

        // Save profile
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            // Save to localStorage
            localStorage.setItem('userName', fullName);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPhone', phone);

            // Update in Supabase
            const userId = localStorage.getItem('userId');
            const SUPABASE_URL = 'https://gztneesmxwfhdmhqikel.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dG5lZXNteHdmaGRtaHFpa2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNjAzNDAsImV4cCI6MjA4MjczNjM0MH0.iWDtkljuQLZFQeLvBrJHVyXNfpu4bJOvvVab3G0eOsA';

            fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                },
                body: JSON.stringify({
                    full_name: fullName,
                    email: email,
                    phone: phone,
                    updated_at: new Date().toISOString()
                })
            })
            .then(() => {
                // Show success message
                document.getElementById('successMessage').classList.add('show');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to save changes. Please try again.');
            });
        });
    </script>
</body>
</html>
